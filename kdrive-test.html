<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kDrive Login-Test</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#f4f6fa;color:#1a1a1a}
  h1{font-size:1.3rem;color:#1f4e8c}
  button{display:block;width:100%;padding:14px;margin:8px 0;font-size:1rem;border:0;border-radius:10px;background:#1f4e8c;color:#fff}
  button.sec{background:#6c7a89}
  pre{background:#fff;border:1px solid #ccd;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all;font-size:.8rem}
  .ok{color:#2e7d32;font-weight:bold}.err{color:#c0392b;font-weight:bold}
  small{color:#666}
</style>
</head>
<body>
<h1>kDrive Login-Test</h1>
<small>Redirect-URL dieser Seite (muss in der Infomaniak-Anwendung eingetragen sein):</small>
<pre id="ru"></pre>

<button id="login">1. Mit Infomaniak anmelden</button>
<button id="t1" class="sec">2. Test: Profil abrufen</button>
<button id="t2" class="sec">3. Test: kDrive-Liste abrufen</button>
<button id="out" class="sec">Abmelden / Token löschen</button>

<h3>Protokoll</h3>
<pre id="log">–</pre>

<script>
const CLIENT_ID = "11b45c4c-1a58-4577-99be-2314377cc6d3";
const AUTH = "https://login.infomaniak.com/authorize";
const TOKEN = "https://login.infomaniak.com/token";
const REDIRECT = location.origin + location.pathname;
document.getElementById("ru").textContent = REDIRECT;

const logEl = document.getElementById("log");
function log(msg, cls){
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = new Date().toLocaleTimeString() + "  " + msg;
  if (logEl.textContent === "–") logEl.textContent = "";
  logEl.appendChild(line);
}
const ss = {
  get(k){ try { return sessionStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { sessionStorage.setItem(k,v); } catch(e){} },
  del(k){ try { sessionStorage.removeItem(k); } catch(e){} }
};

function b64url(buf){
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function rand(n=48){ const a=new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }

document.getElementById("login").onclick = async () => {
  const verifier = rand();
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = rand(16);
  ss.set("pkce_verifier", verifier);
  ss.set("pkce_state", state);
  const p = new URLSearchParams({
    response_type: "code",
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT,
    code_challenge: challenge,
    code_challenge_method: "S256",
    state: state
  });
  location.href = AUTH + "?" + p.toString();
};

async function handleRedirect(){
  const q = new URLSearchParams(location.search);
  if (q.get("error")) { log("Login-Fehler: " + q.get("error") + " – " + (q.get("error_description")||""), "err"); return; }
  const code = q.get("code");
  if (!code) return;
  history.replaceState(null, "", REDIRECT);
  if (q.get("state") !== ss.get("pkce_state")) { log("State stimmt nicht überein – Abbruch", "err"); return; }
  log("Code erhalten, tausche gegen Token …");
  try {
    const r = await fetch(TOKEN, {
      method: "POST",
      headers: {"Content-Type":"application/x-www-form-urlencoded"},
      body: new URLSearchParams({
        grant_type: "authorization_code",
        client_id: CLIENT_ID,
        code: code,
        redirect_uri: REDIRECT,
        code_verifier: ss.get("pkce_verifier") || ""
      })
    });
    const txt = await r.text();
    if (!r.ok) { log("Token-Abruf HTTP " + r.status + ": " + txt, "err"); return; }
    const j = JSON.parse(txt);
    ss.set("access_token", j.access_token);
    log("Token erhalten ✔ (gültig " + (j.expires_in||"?") + " s)", "ok");
  } catch(e) {
    log("Token-Abruf blockiert (vermutlich CORS): " + e.message, "err");
  }
}

async function apiTest(url){
  const t = ss.get("access_token");
  if (!t) { log("Kein Token – erst anmelden", "err"); return; }
  log("GET " + url);
  try {
    const r = await fetch(url, { headers: { Authorization: "Bearer " + t } });
    const txt = await r.text();
    log("HTTP " + r.status + ": " + txt.slice(0, 600), r.ok ? "ok" : "err");
  } catch(e) {
    log("Anfrage blockiert (vermutlich CORS): " + e.message, "err");
  }
}
document.getElementById("t1").onclick = () => apiTest("https://api.infomaniak.com/1/profile");
document.getElementById("t2").onclick = () => apiTest("https://api.infomaniak.com/2/drive");
document.getElementById("out").onclick = () => { ["access_token","pkce_verifier","pkce_state"].forEach(ss.del); log("Token gelöscht"); };

handleRedirect();
</script>
</body>
</html>
